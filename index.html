<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能写作助手 2.5</title>

    <script src="js/marked.min.js">
    </script>
    <link rel="stylesheet" href="css/github.min.css">
    <script src="js/highlight.min.js">
    </script>
    <link rel="stylesheet" href="css/katex.min.css">
    <script src="js/katex.min.js">
    </script>
    <script src="js/auto-render.min.js">
    </script>
    <script src="js/mermaid.min.js">
    </script>
	<script src="js/writeskills.js">
    </script>

    <link rel="stylesheet" href="css/styles.css">

    <style>
		/* 1. 确保最外层布局容器占满视口高度，并使用 Flex 或 Grid 布局 */
		.app-container {
			display: flex;
			height: 100vh;      /* 关键：限制整体高度为视口高度 */
			overflow: hidden;   /* 防止整个页面出现滚动条 */
		}

		/* 2. 左侧章节大纲样式 */
		.sidebar / .outline-panel {
			width: 280px;       /* 根据实际宽度调整 */
			flex-shrink: 0;     /* 防止被压缩 */
			height: 100%;       /* 继承父容器高度 */
			overflow-y: auto;   /* 关键：内容超出时仅左侧显示滚动条 */
			border-right: 1px solid #eee;
		}

		/* 3. 右侧正文区域样式 */
		.main-content {
			flex: 1;             /* 占据右侧剩余空间 */
			height: 100%;        /* 继承父容器高度 */
			display: flex;       /* 开启 Flex 布局 */
			flex-direction: column; /* 垂直排列 */
			overflow: hidden;    /* 🚨 关键修改：取消这里的 overflow-y: auto，防止整体滚动 */
			/* padding: 20px; 可以保留，或者移到内部具体的容器上以确保布局完美 */
		}

		.top-bar, 
		.ai-tools, 
		.prompt-container {
			flex-shrink: 0;      /* 🚨 关键补充：防止 Flex 布局在空间不足时压缩这些固定工具栏 */
		}

		.editor-container {
			flex: 1;             /* 🚨 关键修改：撑满中间所有的剩余高度 */
			display: flex;       
			flex-direction: column; 
			overflow: hidden;    /* 限制死高度，依然不在这里滚动 */
			position: relative;
		}

		/* 赋予具体的编辑器和渲染容器独立的滚动权 */
		.editor-textarea, 
		.editor-preview {
			flex: 1;             /* 撑满 .editor-container */
			height: 100%;        /* 强制 100% 高度 */
			overflow-y: auto;    /* 🚨 关键修改：真正产生滚动条的地方在这里！ */
			/* 如果之前 .main-content 的 padding: 20px 导致贴边，可以在这里加 padding */
			line-height: 1.6 !important; /* 🚨 锁死具体数值：杜绝 div 和 textarea 默认计算差异带来的累计错位 */
			font-family: inherit;        /* 确保两者继承的字体族群绝对一致 */
		}

        /* 针对技能列表项按钮的补充样式 */
        .tech-item-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s, opacity 0.2s;
            font-size: 14px;
            line-height: 1;
        }

        .tech-item-btn:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .tech-item-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .tech-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        /* ===== 参考资料列表美化 ===== */
        .ref-list-scroll {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ref-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
            background: var(--editor-bg);
            user-select: none;
        }

        .ref-item:hover {
            background: var(--bg-sidebar);
            border-color: var(--border-color);
        }

        .ref-item.active {
            background: var(--btn-blue);
            border-color: var(--btn-primary);
            box-shadow: 0 0 0 1px var(--btn-primary);
        }

        [data-theme="dark"] .ref-item.active {
            background: var(--btn-blue);
        }

        .ref-item-checkbox {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--btn-primary);
        }

        .ref-item-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .ref-item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ref-item-preview {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .ref-item-delete {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s, color 0.2s;
        }

        .ref-item:hover .ref-item-delete {
            opacity: 0.6;
        }

        .ref-item-delete:hover {
            opacity: 1 !important;
            background: rgba(211, 47, 47, 0.15);
            color: #d32f2f;
        }

        .ref-batch-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: var(--bg-sidebar);
            border-radius: 8px;
            font-size: 13px;
            flex-shrink: 0;
        }

        .ref-batch-count {
            color: var(--text-muted);
            font-size: 12px;
            margin-right: auto;
        }

        .ref-batch-btn {
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: var(--editor-bg);
            color: var(--text-main);
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .ref-batch-btn:hover {
            background: var(--btn-primary);
            color: #fff;
            border-color: var(--btn-primary);
        }

        .ref-list-footer {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .ref-action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 0;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .ref-action-btn:hover {
            border-color: var(--btn-primary);
            color: var(--btn-primary);
            background: rgba(140, 166, 193, 0.08);
        }

        #ref-edit-pane {
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        #ref-edit-pane.editing {
            opacity: 1;
        }

        /* 空状态 */
        .ref-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-muted);
            text-align: center;
            gap: 12px;
            flex: 1;
        }

        .ref-empty-icon {
            font-size: 40px;
            opacity: 0.4;
        }

        .ref-empty-text {
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="sidebar" id="app-sidebar">
        <div class="sidebar-header">章节大纲</div>
        <div class="outline-list" id="outline-list"></div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="title">
                <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="展开/收起大纲">☰</button>
                文章正文
            </div>
            <div class="tools-basic">
                <button id="toggle-mode-btn" onclick="toggleMode()" title="编辑模式可以进行人工编辑和利用AI进行局部修改，渲染模式不可人工编辑和AI局部修改，但是可以全文修改">👁️ 切换渲染模式</button>
                <div class="dropdown" style="display: inline-block; position: relative;">
                    <button class="dropbtn" onclick="toggleDropdown()">⬇️ 下载 ▼</button>
                    <div class="dropdown-content" id="downloadDropdown">
                        <a href="#" onclick="downloadMarkdown(); return false;">下载为 Markdown (.md)</a>
                        <a href="#" onclick="downloadDocx(); return false;">下载为 Word (.docx)</a>
                    </div>
                </div>
                <button onclick="openModal('history-modal')">🕒 历史版本</button>
                <button onclick="undo()">↶ 撤回</button>
                <button onclick="clearContent()">🗑️ 清空</button>
                <button onclick="toggleTheme()" id="theme-btn" title="切换深色/浅色模式">🌓 暗色</button>
            </div>
        </div>

        <div class="editor-container">
            <textarea id="editor" class="editor-textarea" oninput="handleInput()"></textarea>
            <div id="preview" class="editor-preview markdown-body"></div>
            <div class="status-bar">
                <span id="word-count">字数: 0</span>
                <span id="save-time">最后保存: -</span>
            </div>
        </div>

        <div class="ai-tools">
            <button class="ai-btn btn-green" onclick="setPromptMode('ai_gen')">✍️ 续写</button>
            <button class="ai-btn btn-green" onclick="setPromptMode('rewrite')">📝 扩写</button>
            <button class="ai-btn btn-green" onclick="setPromptMode('summarize')">📄 浓缩</button>
            <button class="ai-btn btn-green" onclick="setPromptMode('polish')">✨ 润色</button>
            <div style="width: 1px; height: 24px; background-color: var(--border-color); margin: 0 5px;"></div>
            <button class="ai-btn btn-purple" onclick="openModal('replace-modal')">🔍 批量替换</button>
            <button class="ai-btn btn-purple" onclick="openModal('ref-modal')">📚 参考资料</button>
            <button class="ai-btn btn-purple" onclick="openModal('tech-modal')">💡 技能</button>
            <button class="ai-btn btn-purple" onclick="openModal('sysprompt-modal')" style="display: none;">🤖 System
                Prompt</button>
            <div style="width: 1px; height: 24px; background-color: var(--border-color); margin: 0 5px;"></div>
            <button class="ai-btn btn-orange" onclick="openModal('config-modal')">⚙️ LLM配置</button>
            <button class="ai-btn btn-orange" onclick="openModal('guide-modal')">📖 帮助</button>

        </div>

        <div class="prompt-container">
            <div class="prompt-title" style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 14px; color: var(--text-main);">AI编辑模式:</span>
                <select id="llm-mode-select" class="btn-modal"
                style="padding: 4px 8px; font-weight: bold; cursor:pointer;" onchange="updateSelectionHint()">
                <option value="full">全文修改</option>
                <option value="local">局部修改</option>
                <option value="append">末尾追加</option>
            </select>
            <span id="selection-hint"></span>
        </div>
        <textarea id="llm-prompt" class="prompt-textarea" placeholder="请输入您的具体编辑或修改指令..."></textarea>
        <div class="prompt-actions">
            <div class="llm-stats-container">
                <div id="llm-status-icon" class="status-icon idle" onclick="showLLMDetails()" title="未调用"></div>
                <div class="llm-stats" id="llm-stats">
                    <span>耗时: 0ms</span> |
                    <span>输入: 0 Tokens</span> |
                    <span>输出: 0 Tokens</span>
                </div>
            </div>
            <button class="submit-btn" id="stop-btn" onclick="stopLLM()"
            style="display: none; background-color: #ff4d4f;">
            <span>停 止</span>
        </button>
        <button class="submit-btn" id="submit-btn" onclick="submitToLLM()">
            <span id="submit-text">提 交</span>
            <div class="loader" id="submit-loader"></div>
        </button>
    </div>
</div>

<div id="floating-toolbar" class="floating-toolbar">
    <button onclick="floatingAction('polish')">✨ 润色</button>
    <button onclick="floatingAction('rewrite')">📝 扩写</button>
    <button onclick="floatingAction('summarize')">📄 浓缩</button>
</div>

<div id="modal-overlay" class="modal-overlay">

    <div id="history-modal" class="modal" style="display: none; width: 900px; max-width: 95vw;">
        <div class="modal-header">
            <span>历史版本管理</span>
            <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
        </div>
        <div class="history-layout">
            <div class="history-list-pane" id="history-list-container"></div>
            <div class="history-preview-pane">
                <textarea id="history-detail-text" class="history-preview-textarea" readonly
            placeholder="点击左侧版本查看全文..."></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-modal btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-modal btn-confirm" id="btn-restore-history"
                onclick="restoreSelectedHistory()" disabled>恢复此版本</button>
            </div>
        </div>
    </div>
</div>

<div id="tech-modal" class="modal" style="display: none; width: 850px; max-width: 95vw;">
    <div class="modal-header">
        <span>写作技能管理</span>
        <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
    </div>
    <div class="history-layout">
        <div class="history-list-pane" id="tech-list-container"></div>
        <div class="history-preview-pane">
            <div class="modal-group">
                <label>技能名称</label>
                <input type="text" id="tech-title" placeholder="如：技术方案写作技能">
            </div>
            <div class="modal-group">
                <label>使用场景或条件</label>
                <input type="text" id="tech-condition" placeholder="在什么情况下触发此技能？">
            </div>
            <div class="modal-group" style="flex:1;">
                <label>技能描述</label>
                <textarea id="tech-desc" placeholder="详细的指导说明..."
            style="height:100%; min-height:120px;"></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
            <button class="btn-modal btn-confirm" onclick="saveTechnique()">保存修改</button>
        </div>
    </div>
</div>
</div>

<div id="replace-modal" class="modal" style="display: none;">
    <div class="modal-header">
        <span>批量替换文本</span>
        <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
    </div>
    <div class="modal-group">
        <label>查找内容</label>
        <input type="text" id="repl-search" placeholder="输入要查找的文字 (支持正则)">
    </div>
    <div class="modal-group">
        <label>替换为</label>
        <input type="text" id="repl-target" placeholder="输入替换后的文字">
    </div>
    <div class="modal-group" style="flex-direction: row; align-items: center; gap: 8px;">
        <input type="checkbox" id="repl-regex">
        <label for="repl-regex" style="font-size: 14px; cursor: pointer;">使用正则表达式</label>
    </div>
    <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-modal btn-confirm" onclick="executeReplace()">全部替换</button>
    </div>
</div>

<div id="config-modal" class="modal" style="display: none;">
    <div class="modal-header">
        <span>LLM 接口配置</span>
        <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
    </div>
    <div class="modal-group">
        <label>接口 URL (例如: https://api.openai.com/v1/chat/completions)</label>
        <input type="text" id="cfg-url" placeholder="必须完整包含 /v1/chat/completions">
    </div>
    <div class="modal-group">
        <label>API Key</label>
        <input type="password" id="cfg-key" placeholder="输入您的 API Key">
    </div>
    <div class="modal-group">
        <label>模型名称 (Model Name)</label>
        <input type="text" id="cfg-model" placeholder="例如: gpt-3.5-turbo">
    </div>
    <div class="modal-group">
        <label>温度参数 (Temperature: 0.0 - 2.0)</label>
        <input type="number" id="cfg-temp" step="0.1" min="0" max="2" value="0.7">
    </div>
    <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-modal btn-confirm" onclick="saveConfig()">保存配置</button>
    </div>
</div>

<div id="ref-modal" class="modal" style="display: none; width: 900px; max-width: 95vw; height: 75vh; max-height: 85vh;">
    <div class="modal-header">
        <span>📚 管理参考资料</span>
        <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
    </div>
    <div class="history-layout" style="flex:1; height:auto; min-height:0;">
        <div class="history-list-pane" id="ref-list-pane" style="overflow-y:visible; display:flex; flex-direction:column;">
            <div class="ref-batch-bar" id="ref-batch-bar" style="display: none;">
                <span class="ref-batch-count" id="ref-batch-count">已选 0 项</span>
                <button class="ref-batch-btn" onclick="batchEnableRefs(true)">全部启用</button>
                <button class="ref-batch-btn" onclick="batchEnableRefs(false)">全部停用</button>
            </div>
            <div class="ref-list-scroll" id="ref-list-container"></div>
            <div class="ref-list-footer">
                <button class="ref-action-btn" onclick="addNewReference()">➕ 新建</button>
                <label class="ref-action-btn" style="cursor:pointer;">📂 导入
                    <input type="file" accept=".txt,.md" onchange="readLocalFile(event)" style="display:none;">
                </label>
            </div>
        </div>
        <div class="history-preview-pane" id="ref-edit-pane">
            <div class="modal-group">
                <label>资料名称</label>
                <input type="text" id="ref-title" placeholder="如：公司背景介绍">
            </div>
            <div class="modal-group" style="flex:1;">
                <label>参考内容</label>
                <textarea id="ref-content" placeholder="在此粘贴参考资料..."
            style="height:100%; min-height:200px;"></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 8px;">
            <span id="ref-save-hint" style="font-size:12px; color:var(--btn-primary); display:none;">✅ 已保存</span>
            <button class="btn-modal btn-cancel" onclick="deleteRefFromList(currentRefIndex)" id="btn-delete-ref" style="display: none;">🗑️ 删除</button>
            <button class="btn-modal btn-confirm" id="btn-save-ref" onclick="saveReference()">💾 保存</button>
        </div>
    </div>
</div>
</div>

<div id="guide-modal" class="modal" style="display: none; width: 850px; max-width: 95vw;">
    <div class="modal-header">
        <span>📖 智能写作助手 使用说明</span>
        <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
    </div>
    <div class="modal-group"
    style="flex:1; overflow-y:auto; max-height: 60vh; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; background: var(--editor-bg);">
    <div id="guide-content" class="editor-preview markdown-body" style="display: block; padding: 10px;"></div>
</div>
<div class="modal-actions">
    <button class="btn-modal btn-confirm" onclick="closeModal()">我已了解</button>
</div>
</div>

<div id="sysprompt-modal" class="modal" style="display: none; width: 600px;">
    <div class="modal-header">
        <span>System Prompt (只读)</span>
        <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
    </div>
    <div class="modal-group">
        <label style="color:var(--btn-primary); font-weight:bold;">系统底层提示词，强制约束 LLM 的行为与输出格式（已适配三种模式）：</label>
        <textarea id="sys-content"
        style="height: 350px; line-height:1.5; font-family: monospace; background: var(--bg-sidebar); border: none;"
        readonly></textarea>
    </div>
    <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeModal()">关闭</button>
    </div>
</div>

<div id="llm-details-modal" class="modal" style="display: none; width: 650px;">
    <div class="modal-header">
        <span>LLM 请求调试详情</span>
        <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
    </div>
    <div class="modal-group" id="llm-error-group" style="display: none;">
        <label style="color: red; font-weight: bold;">❌ 错误信息</label>
        <div id="llm-error-msg"
        style="color: red; font-size: 13px; background: #fee; padding: 10px; border-radius: 6px; border: 1px solid #fcc; word-break: break-all;">
    </div>
</div>
<div class="modal-group">
    <label>Request Payload (提交内容)</label>
    <textarea id="llm-req-text" class="readonly-textarea" readonly></textarea>
</div>
<div class="modal-group">
    <label>Response / Exception (流式输出全记录)</label>
    <textarea id="llm-res-text" class="readonly-textarea" readonly></textarea>
</div>
<div class="modal-actions">
    <button class="btn-modal btn-cancel" onclick="closeModal()">关闭</button>
</div>

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('store')) {
                    db.createObjectStore('store');
                }
            };
            request.onsuccess = (e) => { dbInstance = e.target.result;
                resolve(dbInstance); };
            request.onerror = (e) => reject(e);
        });
    }

    function dbSet(key, val) {
        return new Promise((resolve) => {
            if (!dbInstance) return resolve();
            const tx = dbInstance.transaction('store', 'readwrite');
            tx.objectStore('store').put(val, key);
            tx.oncomplete = () => resolve();
        });
    }

    function dbGet(key) {
        return new Promise((resolve) => {
            if (!dbInstance) return resolve(null);
            const tx = dbInstance.transaction('store', 'readonly');
            const req = tx.objectStore('store').get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
        });
    }

    async function renderMarkdownView() {
        let text = editor.value;
        // if (!text.trim()) text = emptyPromptMarkdown;

        try {
            // 1. 公式保护机制：在 marked 解析前，把公式抽离成占位符，防止 _ 和 * 被错误解析成斜体/粗体
            const mathBlocks = [];
            let placeholderText = text.replace(/(\$\$[\s\S]*?\$\$|\$[^$\n]*?\$)/g, (match) => {
                mathBlocks.push(match);
                return `XYZMATHBLOCK${mathBlocks.length - 1}XYZ`; // 纯字母占位符，不会触发 Markdown
            });

            // 2. 渲染 Markdown
            let html;
            if (typeof marked !== 'undefined') {
                html = marked.parse(placeholderText);
            } else {
                html = `<pre>${placeholderText}</pre>`;
            }

            // 3. 将公式占位符替换回真实的数学公式
            html = html.replace(/XYZMATHBLOCK(\d+)XYZ/g, (match, i) => {
                return mathBlocks[i];
            });

            preview.innerHTML = html;

            // 4. 调用 KaTeX 渲染公式
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(preview, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true }
                    ],
                    throwOnError: false
                });
            }

            // 5. 渲染 Mermaid 图表
            if (typeof mermaid !== 'undefined') {
                const mermaidBlocks = preview.querySelectorAll('.language-mermaid');
                for (let i = 0; i < mermaidBlocks.length; i++) {
                    const block = mermaidBlocks[i];
                    const code = block.textContent; // 获取纯净的代码文本

                    const container = document.createElement('div');
                    container.className = 'mermaid';

                    try {
                        // 加入 Date.now() 确保每次切换渲染模式时 ID 绝对唯一，防止冲突
                        const chartId = 'mermaid-chart-' + Date.now() + '-' + i;
                        const renderResult = await mermaid.render(chartId, code);

                        // 兼容旧版 Mermaid (v9 返回 string) 与 新版 (v10+ 返回对象 {svg})
                        container.innerHTML = typeof renderResult === 'string' ? renderResult : renderResult
                            .svg;

                        // 替换原有的 <pre> 代码块
                        if (block.parentNode && block.parentNode.tagName === 'PRE') {
                            block.parentNode.replaceWith(container);
                        } else {
                            block.replaceWith(container);
                        }
                    } catch (e) {
                        console.error("Mermaid Render Error:", e);
                        container.innerHTML =
                            `<pre style="color:red; font-size: 12px; background: #fee; padding: 10px;">Mermaid Syntax Error:\n${e.message}</pre>`;
                        if (block.parentNode && block.parentNode.tagName === 'PRE') {
                            block.parentNode.replaceWith(container);
                        } else {
                            block.replaceWith(container);
                        }
                    }
                }
            }
        } catch (err) {
            preview.innerHTML = `<p style="color:red">渲染发生致命错误: ${err.message}</p>`;
        }
    }

	function updateOutline() {
        const text = editor.value; 
        // 🚨 删除了原有的 replace！
        // 使用高级正则：(?:...)|(?:...)
        // 前半部分匹配代码块，后半部分匹配标题。以此来完美跳过代码块中的假标题，且不改变字符串真实长度
        const regex = /(?:```[\s\S]*?```)|(?:^(#{1,3})\s+(.*)$)/gm;
        
        let match;
        outlineList.innerHTML = '';
        let count = 0;
        let headingIndex = 0;

        while ((match = regex.exec(text)) !== null) {
            // 如果 match[1] 不存在，说明当前匹配到的是"代码块"，直接跳过不做处理
            if (!match[1]) continue;

            // 此时匹配到的才是真正的标题
            count++;
            const level = match[1].length;
            const title = match[2];
            const div = document.createElement('div');
            div.className = `outline-item outline-h${level}`;
            div.innerText = title;
            div.title = title;
            
            // 🚨 现在的 matchIndex 是基于未删减的绝对原始文本，100% 精准！
            const matchIndex = match.index; 
            const currentHeadingIndex = headingIndex;

            div.onclick = () => {
                if (!isPreviewMode) {
                    editor.focus();
                    editor.setSelectionRange(matchIndex, matchIndex);
                    
                    const clone = document.createElement('div');
                    const style = window.getComputedStyle(editor);
                    
                    const copyProps = [
                        'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
                        'fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing', 
                        'wordSpacing', 'lineHeight', 'textIndent', 'textTransform', 
                        'whiteSpace', 'wordBreak', 'wordWrap', 'tabSize'
                    ];
                    
                    clone.style.cssText = 'position: absolute; visibility: hidden; border: none; top: -9999px; left: -9999px;';
                    
                    copyProps.forEach(prop => {
                        clone.style[prop] = style[prop];
                    });
                    
                    clone.style.width = editor.clientWidth + 'px';
                    clone.style.boxSizing = 'border-box';
                    clone.style.border = 'none';
                    clone.style.overflow = 'hidden';
                    clone.style.whiteSpace = 'pre-wrap'; 
                    
                    clone.textContent = text.substring(0, matchIndex);
                    
                    const span = document.createElement('span');
                    span.textContent = '|'; 
                    clone.appendChild(span);
                    
                    document.body.appendChild(clone);
                    
                    const targetOffsetTop = span.offsetTop;
                    document.body.removeChild(clone);
                    
                    editor.scrollTop = targetOffsetTop - parseInt(style.paddingTop || 0) - 10;
                    
                } else {
                    const headings = preview.querySelectorAll('h1, h2, h3');
                    if (headings[currentHeadingIndex]) headings[currentHeadingIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            outlineList.appendChild(div);
            headingIndex++;
        }
        if (count === 0) outlineList.innerHTML = '<div style="color:#aaa; font-size:12px;">暂无目录结构</div>';
    }

    async function loadLocalData() {
        try {
            const [savedConfig, savedRef, savedInteraction, savedTech] = await Promise.all([
                dbGet('writer_llm_config'), dbGet('writer_ref_data_list'), dbGet('writer_interaction_history'),
                dbGet('writer_techniques')
            ]);
            if (savedConfig) Object.assign(appConfig, savedConfig);
            if (savedRef && Array.isArray(savedRef)) refDataList = savedRef;
            if (savedInteraction) interactionHistory = savedInteraction;

            if (savedTech && savedTech.length > 0) {
                techniques = savedTech;
                let needSave = false;
                for (const defTech of DEFAULT_TECHNIQUES) {
                    const existTech = techniques.find(t => t.id === defTech.id);
                    if (existTech) {
                        if (existTech.description !== defTech.description) { existTech.description = defTech
                                .description;
                            needSave = true; }
                    } else { techniques.push({ ...defTech });
                        needSave = true; }
                }
                if (needSave) await dbSet('writer_techniques', techniques);
            } else {
                techniques = DEFAULT_TECHNIQUES.map(t => ({ ...t }));
                await dbSet('writer_techniques', techniques);
            }
        } catch (error) { console.error("Failed to load local data:", error); }
    }

    function renderRefList() {
        const container = document.getElementById('ref-list-container');
        const batchBar = document.getElementById('ref-batch-bar');
        const editPane = document.getElementById('ref-edit-pane');
        container.innerHTML = '';

        if (refDataList.length === 0) {
            container.innerHTML = `<div class="ref-empty-state">
                <div class="ref-empty-icon">📭</div>
                <div class="ref-empty-text">暂无参考资料<br>点击下方按钮新建或导入</div>
            </div>`;
            batchBar.style.display = 'none';
            editPane.classList.remove('editing');
            selectRef(-1);
            return;
        }

        batchBar.style.display = 'flex';
        updateBatchCount();

        refDataList.forEach((ref, i) => {
            const item = document.createElement('div');
            item.className = 'ref-item';
            if (i === currentRefIndex) item.classList.add('active');

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'ref-item-checkbox';
            cb.checked = ref.enabled !== false;
            cb.title = ref.enabled ? '点击停用' : '点击启用';
            cb.onclick = (e) => {
                e.stopPropagation();
                toggleRefEnabled(i);
            };

            const body = document.createElement('div');
            body.className = 'ref-item-body';
            const preview = ref.content ? ref.content.replace(/\n/g, ' ').substring(0, 50) + (ref.content.length > 50 ? '...' : '') : '点击编辑内容...';
            body.innerHTML = `<div class="ref-item-name">${ref.title || '未命名资料'}</div>
                <div class="ref-item-preview">${preview}</div>`;

            const delBtn = document.createElement('button');
            delBtn.className = 'ref-item-delete';
            delBtn.innerHTML = '🗑️';
            delBtn.title = '删除此资料';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteRefFromList(i);
            };

            body.onclick = () => selectRef(i);
            item.appendChild(cb);
            item.appendChild(body);
            item.appendChild(delBtn);
            container.appendChild(item);
        });

        // Maintain selection
        if (currentRefIndex >= 0 && currentRefIndex < refDataList.length) {
            selectRef(currentRefIndex);
        } else if (refDataList.length > 0) {
            selectRef(0);
        }
    }

    // ===================== 【自动滚动辅助函数】 =====================

    /**
     * 计算指定文本在textarea中的滚动位置（文本末尾对应的scrollTop值）
     * 使用与updateOutline相同的clone方法精确测量
     * @param {string} text - 要计算滚动位置的文本
     * @returns {number} - 对应的scrollTop值
     */
	function getScrollPositionForText(text) {
        const clone = document.createElement('div');
        const style = window.getComputedStyle(editor);
        
        const copyProps = [
            'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
            'fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing', 
            'wordSpacing', 'lineHeight', 'textIndent', 'textTransform', 
            'whiteSpace', 'wordBreak', 'wordWrap', 'tabSize'
        ];
        
        clone.style.cssText = 'position: absolute; visibility: hidden; top: -9999px; left: -9999px;';
        copyProps.forEach(prop => clone.style[prop] = style[prop]);
        
        // 🚨 同样应用核心修复
        clone.style.width = editor.clientWidth + 'px';
        clone.style.boxSizing = 'border-box';
        clone.style.border = 'none';
        clone.style.overflow = 'hidden';
        clone.style.whiteSpace = 'pre-wrap';
        
        clone.textContent = text;
        document.body.appendChild(clone);
        const scrollY = clone.offsetHeight;
        document.body.removeChild(clone);
        return Math.max(0, scrollY - parseInt(style.paddingTop || 20));
    }

    /**
     * 设置自动滚动：初始滚动到目标位置，并注册用户交互监听器
     * 一旦用户点击鼠标、滚动滚轮、触摸屏幕或按下导航键，则取消本次自动滚动
     * @param {string} mode - 编辑模式 ('full' | 'local' | 'append')
     * @param {string} baseTextPre - 修改位置之前的文本（局部修改时用于定位）
     */
    function setupAutoScroll(mode, baseTextPre) {
        autoScrollEnabled = true;

        // 初始滚动到待修改位置
        if (mode === 'local' && baseTextPre) {
            // 局部修改：滚动到被选中段落的起始位置（baseTextPre的末尾）
            const targetScroll = getScrollPositionForText(baseTextPre);
            editor.scrollTop = Math.max(0, targetScroll - 80);
        } else {
            // 全文修改/末尾追加：滚动到文章末尾
            editor.scrollTop = editor.scrollHeight;
        }

        // 标记是否已触发清理（防止重复清理）
        let cleaned = false;

        const cleanup = () => {
            if (cleaned) return;
            cleaned = true;
            autoScrollEnabled = false;
            editor.removeEventListener('wheel', onWheel);
            editor.removeEventListener('mousedown', onUserInteract);
            editor.removeEventListener('keydown', onKeyDown);
            editor.removeEventListener('touchstart', onUserInteract);
            document.removeEventListener('wheel', onDocWheel);
            document.removeEventListener('mousedown', onDocMouseDown);
        };

        const onUserInteract = () => {
            autoScrollEnabled = false;
            cleanup();
        };

        const onWheel = (e) => {
            // 滚轮事件：用户在editor上滚动鼠标滚轮
            autoScrollEnabled = false;
            cleanup();
        };

        const onDocWheel = (e) => {
            // 用户在页面其他区域滚动滚轮（可能是在预览区或页面本身）
            // 仅在事件目标不是editor时处理（editor上的由onWheel处理）
            if (e.target !== editor && !editor.contains(e.target)) {
                autoScrollEnabled = false;
                cleanup();
            }
        };

        const onDocMouseDown = (e) => {
            // 用户在页面任意位置点击鼠标
            if (e.target !== editor && !editor.contains(e.target)) {
                autoScrollEnabled = false;
                cleanup();
            }
        };

        const onKeyDown = (e) => {
            // 检测滚动相关的键盘操作
            const scrollKeys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '];
            if (scrollKeys.includes(e.key)) {
                autoScrollEnabled = false;
                cleanup();
            }
        };

        // 在editor上注册事件
        editor.addEventListener('wheel', onWheel, { passive: true });
        editor.addEventListener('mousedown', onUserInteract);
        editor.addEventListener('keydown', onKeyDown);
        editor.addEventListener('touchstart', onUserInteract, { passive: true });

        // 在document上也注册（捕获用户在编辑器外的交互）
        document.addEventListener('wheel', onDocWheel, { passive: true });
        document.addEventListener('mousedown', onDocMouseDown);

        // 保存清理函数引用，供外部调用
        autoScrollCleanup = cleanup;
    }

    /**
     * 清理自动滚动状态和事件监听器
     */
    function cleanupAutoScroll() {
        if (autoScrollCleanup) {
            autoScrollCleanup();
            autoScrollCleanup = null;
        }
        autoScrollEnabled = false;
    }

    // ====================================================================

    // 1. 主控函数：负责整体请求调度与异常捕获
    async function submitToLLM() {
        const promptInput = document.getElementById('llm-prompt').value.trim();
        if (!promptInput) { alert("请输入需要发送给 LLM 的指令！"); return; }
        if (!appConfig.url) { alert("请先在 [⚙️ LLM配置] 中设置正确的接口 URL。"); return; }

        // 构建请求上下文
        const ctx = buildLLMContext(promptInput);
        if (!ctx) return; // 校验失败（如未选中文本）则终止

        abortController = new AbortController();
        lastLLMReq = JSON.stringify(ctx.payload, null, 2);
        lastLLMRes = "";
        lastLLMErr = "";
        const startTime = Date.now();

        setLLMUIState(true); // 切换为加载中 UI

        // ============ 【新增】设置自动滚动 ============
        // 在UI锁定后、流式处理前，滚动到目标位置并注册用户交互检测
        setupAutoScroll(ctx.mode, ctx.baseTextPre);
        // ===========================================

        try {
            const response = await fetch(appConfig.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${appConfig.key}`,
                    'Accept': 'text/event-stream' },
                body: lastLLMReq,
                signal: abortController.signal
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errText}`);
            }

            // 处理流式输出
            const streamResult = await processSSEStream(response.body.getReader(), ctx);

            // 收尾更新
            saveState(editor.value);
            updateUI();

            // 记录交互历史
            interactionHistory.push({ user: promptInput, assistant: streamResult.finalText });
            if (interactionHistory.length > 10) interactionHistory.shift();
            dbSet('writer_interaction_history', interactionHistory);

            // 更新统计看板
            const duration = Date.now() - startTime;
            let displayReasoning = streamResult.rawReasoningText ?
                `\n\n【独立思考过程 (reasoning_content)】\n${streamResult.rawReasoningText}` : '';
            lastLLMRes =
                `【SSE 流式传输成功】\n最终提取文本字数：${streamResult.finalText.length}\n最终生成Tokens：${streamResult.outputTokens}${displayReasoning}\n\n【底层原始完整输出 (content)】\n${streamResult.rawOutputText}`;

            statusIcon.className = 'status-icon success';
            statusIcon.title = "请求成功，点击查看详情";
            document.getElementById('llm-stats').innerHTML =
                `<span>耗时: ${duration}ms</span> | <span>输入: ${streamResult.actualInputTokens} Tokens</span> | <span>输出: ${streamResult.outputTokens} Tokens</span>`;

        } catch (error) {
            const duration = Date.now() - startTime;
            lastLLMErr = error.toString();
            statusIcon.className = 'status-icon error';
            statusIcon.title = "请求失败，点击查看详情";
            document.getElementById('llm-stats').innerHTML =
                `<span style="color:red;">耗时: ${duration}ms (失败)</span> | <span>输入: ~${ctx.estimatedTokens} Tokens</span> | <span>输出: 0 Tokens</span>`;
        } finally {
            setLLMUIState(false); // 恢复 UI 状态（内部会清理自动滚动）
            abortController = null;
        }
    }

    // 2. 数据构建：负责处理文本截取、System Prompt 组装
    function buildLLMContext(promptInput) {
        const modeSelect = document.getElementById('llm-mode-select').value;
        const fullText = editor.value;
        const originalStart = editor.selectionStart;
        const originalEnd = editor.selectionEnd;
        const selectedText = fullText.substring(originalStart, originalEnd);

        if (modeSelect === 'local' && originalStart === originalEnd) {
            alert("【局部修改】模式下，请先在编辑器正文中选中需要修改的文字范围！");
            return null;
        }

        const modeStrMap = { 'full': '全文修改', 'local': '局部修改', 'append': '末尾追加' };
        const modeStr = modeStrMap[modeSelect] || '全文修改';

        let userContent =
            `<edit_mode>${modeStr}</edit_mode>\n<task_instruction>\n${promptInput}\n</task_instruction>\n\n`;
        const enabledRefs = refDataList.filter(r => r.enabled && r.content.trim() !== "");
        for (const ref of enabledRefs) {
            userContent += `<reference_material>\n## ${ref.title}\n${ref.content}\n</reference_material>\n\n`;
        }

        let baseTextPre = "",
            baseTextPost = "";
        if (modeSelect === 'local') {
            baseTextPre = fullText.substring(0, originalStart);
            baseTextPost = fullText.substring(originalEnd);
            userContent +=
                `<before_selection>\n${baseTextPre}\n</before_selection>\n\n<target_text_to_process>\n${selectedText}\n</target_text_to_process>\n\n<after_selection>\n${baseTextPost}\n</after_selection>\n`;
        } else if (modeSelect === 'append') {
            baseTextPre = fullText + (fullText.endsWith('\n') ? "" : "\n\n");
            userContent += `<full_context>\n${fullText}\n</full_context>\n`;
        } else {
            userContent += `<full_context>\n${fullText}\n</full_context>\n`;
        }

        let finalSysPrompt = sysPromptText;
        let techStr = techniques.filter(t => t.enabled).map(t =>
            `- **技能名称**：${t.title}\n  - **使用场景**：${t.condition}\n  - **执行要求**：${t.description}\n`).join(
            '');
        if (techStr) {
            finalSysPrompt +=
                `\n\n## 启用的专属写作技能:\n当前用户为你启用了以下专属写作技能。这是你执行任务的最高准则！请仔细阅读其【使用场景】和【执行要求】，写作技能在【使用场景】与写作要求、文体类型、用户指令匹配时才生效。写作技能生效时，在生成内容时严格贯彻其写作风格、语气和结构排版规范，如果技能要求与常规行为冲突，以技能要求为准：\n${techStr}`;
        }

        let messagesPayload = [{ role: "system", content: finalSysPrompt }];
        for (let msg of interactionHistory.slice(-10)) {
            messagesPayload.push({ role: "user", content: msg.user.length > 200 ? msg.user.substring(0, 200) +
                    '...[已截断]' : msg.user });
            messagesPayload.push({ role: "assistant", content: msg.assistant.length > 200 ? msg.assistant.substring(0,
                    200) + '...[已截断]' : msg.assistant });
        }
        messagesPayload.push({ role: "user", content: userContent });

        const payload = {
            model: appConfig.model,
            temperature: appConfig.temp,
            stream: true,
            stream_options: { include_usage: true },
            enable_thinking: true,
            extra_body: { enable_thinking: true },
            messages: messagesPayload
        };

        return {
            payload,
            baseTextPre,
            baseTextPost,
            mode: modeSelect, // 【新增】传递模式信息，供自动滚动使用
            estimatedTokens: Math.floor(JSON.stringify(payload).length * 0.8)
        };
    }

    // 3. UI 状态管理器：控制按钮、加载条与禁用逻辑
    function setLLMUIState(isProcessing) {
        const btn = document.getElementById('submit-btn');
        const btnText = document.getElementById('submit-text');
        const loader = document.getElementById('submit-loader');
        const stopBtn = document.getElementById('stop-btn');

        btn.disabled = isProcessing;
        btn.style.display = isProcessing ? 'none' : 'flex';
        stopBtn.style.display = isProcessing ? 'flex' : 'none';
        btnText.style.display = isProcessing ? 'none' : 'block';
        loader.style.display = isProcessing ? 'block' : 'none';

        editor.readOnly = isProcessing;
        if (isProcessing) {
            statusIcon.className = 'status-icon loading';
            statusIcon.title = "请求发送中...";
        } else {
            // ============ 【新增】流结束时清理自动滚动 ============
            cleanupAutoScroll();
            // ===================================================
            if (isPreviewMode) renderMarkdownView();
            document.getElementById('selection-hint').innerHTML = '';
        }
    }

    // 4. 数据流解析器：处理 SSE 流与节流渲染
    async function processSSEStream(reader, ctx) {
        const decoder = new TextDecoder('utf-8');
        let buffer = '',
            pendingData = '';
        let lastRenderTime = 0;

        // 声明状态机对象
        const state = {
            rawOutputText: '',
            rawReasoningText: '',
            cleanOutputText: '',
            lastProcessedIndex: 0,
            isThinking: false,
            hasFinishedThinking: false,
            outputTokens: 0,
            actualInputTokens: ctx.estimatedTokens
        };

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            let match;
            let isStreamDone = false;
            while ((match = /\r?\n\r?\n/.exec(buffer)) !== null) {
                let chunk = buffer.slice(0, match.index).trim();
                buffer = buffer.slice(match.index + match[0].length);
                if (!chunk) continue;

                let chunkDataStr = chunk.replace(/(^|\n)data:\s*/gi, '').trim();
                if (chunkDataStr === '[DONE]') { isStreamDone = true; break; }

                if (chunkDataStr) {
                    pendingData += chunkDataStr;
                    try {
                        const data = JSON.parse(pendingData);
                        pendingData = '';

                        // 更新 Token 统计
                        if (data.usage) {
                            if (data.usage.completion_tokens) state.outputTokens = data.usage
                                .completion_tokens;
                            if (data.usage.prompt_tokens) state.actualInputTokens = data.usage.prompt_tokens;
                        }
                        // 核心流数据注入状态机
                        if (data.choices && data.choices[0].delta) {
                            const delta = data.choices[0].delta;
                            if (delta.reasoning_content) state.rawReasoningText += delta.reasoning_content;
                            if (delta.content) updateThinkStateMachine(state, delta.content);
                        }
                    } catch (e) { /* JSON不完整，等待下一个块拼接 */ }
                }
            }
            if (isStreamDone) break;

            // 节流渲染 UI (30fps)
            const now = Date.now();
            if (now - lastRenderTime >= 33) {
                editor.value = ctx.baseTextPre + state.cleanOutputText + ctx.baseTextPost;

                // ============ 【修改】条件性自动滚动 ============
                if (autoScrollEnabled) {
                    if (ctx.mode === 'local' && ctx.baseTextPre) {
                        // 局部修改：滚动到新输出内容的末尾（baseTextPre + cleanOutputText）
                        const targetText = ctx.baseTextPre + state.cleanOutputText;
                        const targetScroll = getScrollPositionForText(targetText);
                        editor.scrollTop = Math.max(0, targetScroll - 80);
                    } else {
                        // 全文修改/末尾追加：滚动到文章末尾
                        editor.scrollTop = editor.scrollHeight;
                    }
                }
                // ===============================================

                lastRenderTime = now;
            }
        }

        // 【修复漏洞1】处理流意外断开时，残留在 buffer 中的最后一条数据
        if (buffer.trim()) {
            let chunkDataStr = buffer.replace(/(^|\n)data:\s*/gi, '').trim();
            if (chunkDataStr && chunkDataStr !== '[DONE]') {
                try {
                    const data = JSON.parse(chunkDataStr);
                    if (data.choices && data.choices[0].delta && data.choices[0].delta.content) {
                        updateThinkStateMachine(state, data.choices[0].delta.content);
                    }
                } catch (e) {}
            }
        }

        // 【修复漏洞2】释放状态机为了检测 <think>/</think> 标签而强制扣留的最后几个字符
        // isThinking=true 表示 <think> 未闭合，此时扣留内容属于思考过程，应静默丢弃
        if (state.lastProcessedIndex < state.rawOutputText.length) {
            if (!state.isThinking) {
                state.cleanOutputText += state.rawOutputText.substring(state.lastProcessedIndex);
            }
            state.lastProcessedIndex = state.rawOutputText.length;
        }

        // 最终无损渲染
        const finalCleanText = state.cleanOutputText.trimStart();
        editor.value = ctx.baseTextPre + finalCleanText + ctx.baseTextPost;
        editor.focus();
        const endCursor = ctx.baseTextPre.length + finalCleanText.length;
        editor.setSelectionRange(endCursor, endCursor);

        state.outputTokens = state.outputTokens || Math.floor((state.rawOutputText.length + state.rawReasoningText
            .length) * 0.8);
        return {
            finalText: finalCleanText,
            rawOutputText: state.rawOutputText,
            rawReasoningText: state.rawReasoningText,
            outputTokens: state.outputTokens,
            actualInputTokens: state.actualInputTokens
        };
    }

    // 5. 状态机机制：专职拦截 `<think>` 标签内容
    function updateThinkStateMachine(state, newContent) {
        state.rawOutputText += newContent;
        let searchStart = state.lastProcessedIndex;

        while (searchStart < state.rawOutputText.length) {
            if (!state.hasFinishedThinking) {
                if (!state.isThinking) {
                    let thinkStart = state.rawOutputText.indexOf('<think>', searchStart);
                    if (thinkStart !== -1) {
                        state.cleanOutputText += state.rawOutputText.substring(searchStart, thinkStart);
                        state.isThinking = true;
                        searchStart = thinkStart + '<think>'.length;
                    } else {
                        // 安全防截断，保留7个字符看下文是否能拼成 <think>
                        let safeEnd = Math.max(searchStart, state.rawOutputText.length - 7);
                        if (safeEnd > searchStart) {
                            state.cleanOutputText += state.rawOutputText.substring(searchStart, safeEnd);
                            searchStart = safeEnd;
                        }
                        break;
                    }
                } else {
                    let thinkEnd = state.rawOutputText.indexOf('</think>', searchStart);
                    if (thinkEnd !== -1) {
                        state.isThinking = false;
                        state.hasFinishedThinking = true;
                        searchStart = thinkEnd + '</think>'.length;
                    } else {
                        // 安全防截断，保留8个字符看下文是否能拼成 </think>
                        let safeEnd = Math.max(searchStart, state.rawOutputText.length - 8);
                        if (safeEnd > searchStart) searchStart = safeEnd;
                        break;
                    }
                }
            } else {
                state.cleanOutputText += state.rawOutputText.substring(searchStart);
                searchStart = state.rawOutputText.length;
                break;
            }
        }
        state.lastProcessedIndex = searchStart;
    }
</script>
