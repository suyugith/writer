<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业文本对比工具 (Diff Tool)</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --border-color: #e1e4e8;
            --text-primary: #24292e;
            --text-secondary: #586069;
            --accent-color: #0366d6;
            --accent-hover: #0250a3;
            --del-bg: #ffeef0;
            --del-text: #b31d28;
            --del-char-bg: #fdb8c0;
            --ins-bg: #e6ffed;
            --ins-text: #22863a;
            --ins-char-bg: #acf2bd;
            --empty-bg: #fafbfc;
            --line-num-color: #959da5;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        /* 输入区域布局 */
        .input-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .input-section { flex-direction: column; }
        }

        .file-box {
            flex: 1;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .file-box.drag-over {
            border-color: var(--accent-color);
            background-color: #f1f8ff;
        }

        .file-box label {
            font-weight: 600;
            font-size: 14px;
        }

        .drop-zone {
            border: 2px dashed #d1d5da;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            transition: all 0.2s;
        }
        .drop-zone:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .drop-zone input[type="file"] { display: none; }

        .or-divider {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            position: relative;
            margin: 4px 0;
        }
        .or-divider::before, .or-divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #eee;
        }
        .or-divider::before { left: 0; }
        .or-divider::after { right: 0; }

        textarea {
            width: 100%;
            height: 150px;
            resize: vertical;
            padding: 10px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-primary);
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(3, 102, 214, 0.1);
        }

        /* 动作与统计栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        button {
            padding: 8px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: #959da5; cursor: not-allowed; }

        .btn-secondary {
            background-color: #fafbfc;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background-color: #f3f4f6; }
        .btn-secondary.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .stats {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .stats .ins { color: var(--ins-text); font-weight: bold; }
        .stats .del { color: var(--del-text); font-weight: bold; }

        #loading {
            display: none;
            color: var(--accent-color);
            font-size: 13px;
            font-weight: 500;
        }

        /* 对比区域样式 */
        .diff-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .diff-header {
            display: flex;
            background-color: #f6f8fa;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .diff-header .diff-col {
            padding: 10px 15px;
        }

        .diff-body {
            overflow: auto;
            max-height: 70vh;
            position: relative;
        }

        .diff-row {
            display: flex;
            border-bottom: 1px solid #eaecef;
            min-height: 24px;
        }
        .diff-row:last-child { border-bottom: none; }

        .diff-col {
            flex: 1;
            display: flex;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 13px;
            line-height: 20px;
            width: 50%;
        }
        .diff-col:first-child {
            border-right: 1px solid var(--border-color);
        }

        .line-num {
            color: var(--line-num-color);
            width: 50px;
            flex-shrink: 0;
            text-align: right;
            padding: 2px 8px 2px 0;
            user-select: none;
            border-right: 1px solid #eaecef;
            font-size: 12px;
            align-self: flex-start; /* 关键：确保行号与第一行文本对齐 */
        }

        .line-content {
            flex: 1;
            padding: 2px 10px;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        /* 状态颜色 */
        .line-equal { background-color: #ffffff; }
        .line-delete { background-color: var(--del-bg); }
        .line-delete .line-content { color: var(--del-text); }
        .line-delete .line-num { background-color: #ffdce0; }
        
        .line-insert { background-color: var(--ins-bg); }
        .line-insert .line-content { color: var(--ins-text); }
        .line-insert .line-num { background-color: #cdffd8; }
        
        .line-empty { background-color: var(--empty-bg); }
        .line-empty .line-num { background-color: #f1f2f3; }

        /* 行内字符高亮 */
        .char-delete { background-color: var(--del-char-bg); border-radius: 2px; padding: 1px 0; }
        .char-insert { background-color: var(--ins-char-bg); border-radius: 2px; padding: 1px 0; }

        /* 折叠提示 */
        .folded-row {
            background-color: #f1f8ff;
            text-align: center;
            padding: 8px;
            color: var(--accent-color);
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #eaecef;
            user-select: none;
        }
        .folded-row:hover { background-color: #dbedff; }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <h1>📝 专业文本对比工具</h1>

    <!-- 输入区 -->
    <div class="input-section">
        <div class="file-box" id="box1">
            <label>旧文本 (原版)</label>
            <div class="drop-zone" id="drop1">
                <input type="file" id="file1" accept=".txt,.js,.html,.css,.json,.md,.xml,.csv,.py,.java,.cpp,.c,.h,.log">
                <span>点击选择文件 或 拖拽文件到此处</span>
            </div>
            <div class="or-divider">或粘贴文本</div>
            <textarea id="text1" placeholder="在此处直接粘贴旧版本的内容..."></textarea>
        </div>
        <div class="file-box" id="box2">
            <label>新文本 (修改后)</label>
            <div class="drop-zone" id="drop2">
                <input type="file" id="file2" accept=".txt,.js,.html,.css,.json,.md,.xml,.csv,.py,.java,.cpp,.c,.h,.log">
                <span>点击选择文件 或 拖拽文件到此处</span>
            </div>
            <div class="or-divider">或粘贴文本</div>
            <textarea id="text2" placeholder="在此处直接粘贴新版本的内容..."></textarea>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-left">
            <button id="btnCompare" onclick="startCompare()">开始对比</button>
            <span id="loading">⏳ 正在计算差异...</span>
            <div class="stats" id="stats"></div>
        </div>
        <div class="toolbar-right">
            <button class="btn-secondary" id="btnFold" onclick="toggleFold()">折叠相同代码</button>
            <button class="btn-secondary" id="btnClear" onclick="clearAll()">清空</button>
        </div>
    </div>

    <!-- 结果输出区 -->
    <div class="diff-container" id="output">
        <div class="diff-header">
            <div class="diff-col" id="title1">旧文本</div>
            <div class="diff-col" id="title2">新文本</div>
        </div>
        <div class="diff-body" id="diffBody">
            <div class="empty-state">
                请在上方选择文件或粘贴文本，然后点击“开始对比”按钮。
            </div>
        </div>
    </div>

    <script>
        // ================= 配置与状态 =================
        let isFolded = false;
        let currentDiffs = [];
        let currentTitles = { t1: '旧文本', t2: '新文本' };

        // ================= UI 交互逻辑 =================
        
        // 1. 拖拽上传支持
        function setupDragDrop(boxId, dropId, fileId, textId) {
            const box = document.getElementById(boxId);
            const dropZone = document.getElementById(dropId);
            const fileInput = document.getElementById(fileId);
            const textArea = document.getElementById(textId);

            dropZone.addEventListener('click', () => fileInput.click());

            ['dragenter', 'dragover'].forEach(evt => {
                box.addEventListener(evt, (e) => { e.preventDefault(); box.classList.add('drag-over'); });
            });
            ['dragleave', 'drop'].forEach(evt => {
                box.addEventListener(evt, (e) => { e.preventDefault(); box.classList.remove('drag-over'); });
            });

            box.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    fileInput.files = files;
                    fileInput.dispatchEvent(new Event('change'));
                }
            });

            // 互斥逻辑
            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    textArea.value = '';
                    dropZone.querySelector('span').textContent = `已选择: ${this.files[0].name}`;
                }
            });
            textArea.addEventListener('input', function() {
                if (this.value.trim().length > 0) {
                    fileInput.value = '';
                    dropZone.querySelector('span').textContent = '点击选择文件 或 拖拽文件到此处';
                }
            });
        }

        setupDragDrop('box1', 'drop1', 'file1', 'text1');
        setupDragDrop('box2', 'drop2', 'file2', 'text2');

        // 2. 工具栏按钮逻辑
        function toggleFold() {
            isFolded = !isFolded;
            document.getElementById('btnFold').classList.toggle('active', isFolded);
            if (currentDiffs.length > 0) {
                renderDiff(currentDiffs, currentTitles.t1, currentTitles.t2);
            }
        }

        function clearAll() {
            document.getElementById('file1').value = '';
            document.getElementById('file2').value = '';
            document.getElementById('text1').value = '';
            document.getElementById('text2').value = '';
            document.getElementById('drop1').querySelector('span').textContent = '点击选择文件 或 拖拽文件到此处';
            document.getElementById('drop2').querySelector('span').textContent = '点击选择文件 或 拖拽文件到此处';
            document.getElementById('diffBody').innerHTML = '<div class="empty-state">请在上方选择文件或粘贴文本，然后点击“开始对比”按钮。</div>';
            document.getElementById('stats').innerHTML = '';
            currentDiffs = [];
        }

        // ================= 核心算法与工具函数 =================

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function readFile(file) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve("");
                if (file.size > 10 * 1024 * 1024) return reject(new Error("文件大小超过 10MB，请使用专业 IDE 进行对比。"));
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e);
                reader.readAsText(file);
            });
        }

        // 优化的 LCS 算法 (带内存保护)
        function computeLCS(a, b) {
            const m = a.length, n = b.length;
            // 内存保护：如果矩阵过大，降级处理或截断
            if (m * n > 15000000) {
                console.warn("文本差异过大，降级为简单逐行对比");
                return simpleDiff(a, b); 
            }

            const dp = Array(m + 1).fill(null).map(() => new Uint16Array(n + 1));
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
                }
            }

            const diffs = [];
            let i = m, j = n;
            while (i > 0 && j > 0) {
                if (a[i - 1] === b[j - 1]) {
                    diffs.unshift({ type: 'equal', valA: a[i - 1], valB: b[j - 1], lineA: i, lineB: j });
                    i--; j--;
                } else if (dp[i - 1][j] >= dp[i][j - 1]) {
                    diffs.unshift({ type: 'delete', valA: a[i - 1], valB: null, lineA: i, lineB: null });
                    i--;
                } else {
                    diffs.unshift({ type: 'insert', valA: null, valB: b[j - 1], lineA: null, lineB: j });
                    j--;
                }
            }
            while (i > 0) { diffs.unshift({ type: 'delete', valA: a[i - 1], valB: null, lineA: i, lineB: null }); i--; }
            while (j > 0) { diffs.unshift({ type: 'insert', valA: null, valB: b[j - 1], lineA: null, lineB: j }); j--; }
            
            return diffs;
        }

        // 降级用的简单对比算法 (O(N))
        function simpleDiff(a, b) {
            const diffs = [];
            const maxLen = Math.max(a.length, b.length);
            for (let i = 0; i < maxLen; i++) {
                if (i < a.length && i < b.length) {
                    if (a[i] === b[i]) diffs.push({ type: 'equal', valA: a[i], valB: b[i], lineA: i+1, lineB: i+1 });
                    else {
                        diffs.push({ type: 'delete', valA: a[i], valB: null, lineA: i+1, lineB: null });
                        diffs.push({ type: 'insert', valA: null, valB: b[i], lineA: null, lineB: i+1 });
                    }
                } else if (i < a.length) {
                    diffs.push({ type: 'delete', valA: a[i], valB: null, lineA: i+1, lineB: null });
                } else {
                    diffs.push({ type: 'insert', valA: null, valB: b[i], lineA: null, lineB: i+1 });
                }
            }
            return diffs;
        }

        // 行内字符级 Diff (用于高亮具体修改的字符)
        function getInlineDiff(str1, str2) {
            if (str1.length * str2.length > 500000) return { html1: escapeHtml(str1), html2: escapeHtml(str2) };
            
            const m = str1.length, n = str2.length;
            const dp = Array(m + 1).fill(null).map(() => new Uint16Array(n + 1));
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    dp[i][j] = str1[i - 1] === str2[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
                }
            }

            let res1 = [], res2 = [];
            let i = m, j = n;
            while (i > 0 && j > 0) {
                if (str1[i - 1] === str2[j - 1]) {
                    res1.unshift(escapeHtml(str1[i - 1]));
                    res2.unshift(escapeHtml(str2[j - 1]));
                    i--; j--;
                } else if (dp[i - 1][j] >= dp[i][j - 1]) {
                    res1.unshift(`<span class="char-delete">${escapeHtml(str1[i - 1])}</span>`);
                    i--;
                } else {
                    res2.unshift(`<span class="char-insert">${escapeHtml(str2[j - 1])}</span>`);
                    j--;
                }
            }
            while (i > 0) { res1.unshift(`<span class="char-delete">${escapeHtml(str1[i - 1])}</span>`); i--; }
            while (j > 0) { res2.unshift(`<span class="char-insert">${escapeHtml(str2[j - 1])}</span>`); j--; }

            return { html1: res1.join(''), html2: res2.join('') };
        }

        // ================= 渲染逻辑 =================

        function renderDiff(diffs, title1, title2) {
            document.getElementById('title1').textContent = title1;
            document.getElementById('title2').textContent = title2;

            let insCount = 0, delCount = 0;
            const htmlParts = [];
            let equalBuffer = [];

            const flushEqualBuffer = () => {
                if (equalBuffer.length === 0) return;
                if (isFolded && equalBuffer.length > 6) {
                    // 保留头尾各3行
                    htmlParts.push(...equalBuffer.slice(0, 3));
                    htmlParts.push(`<div class="folded-row" onclick="toggleFold()">⊞ 展开未修改的 ${equalBuffer.length - 6} 行...</div>`);
                    htmlParts.push(...equalBuffer.slice(-3));
                } else {
                    htmlParts.push(...equalBuffer);
                }
                equalBuffer = [];
            };

            for (let k = 0; k < diffs.length; k++) {
                const d = diffs[k];
                
                if (d.type === 'equal') {
                    const val = escapeHtml(d.valA) || '&nbsp;';
                    equalBuffer.push(`
                        <div class="diff-row">
                            <div class="diff-col line-equal"><span class="line-num">${d.lineA}</span><span class="line-content">${val}</span></div>
                            <div class="diff-col line-equal"><span class="line-num">${d.lineB}</span><span class="line-content">${val}</span></div>
                        </div>`);
                } else {
                    flushEqualBuffer();
                    
                    // 检查是否是连续的 delete 和 insert (即修改操作)
                    let isModify = false;
                    let nextD = diffs[k + 1];
                    if (d.type === 'delete' && nextD && nextD.type === 'insert') {
                        isModify = true;
                    }

                    if (isModify) {
                        const inline = getInlineDiff(d.valA, nextD.valB);
                        htmlParts.push(`
                            <div class="diff-row">
                                <div class="diff-col line-delete"><span class="line-num">${d.lineA}</span><span class="line-content">${inline.html1}</span></div>
                                <div class="diff-col line-insert"><span class="line-num">${nextD.lineB}</span><span class="line-content">${inline.html2}</span></div>
                            </div>`);
                        k++; // 跳过下一个 insert
                        delCount++; insCount++;
                    } else if (d.type === 'delete') {
                        const val = escapeHtml(d.valA) || '&nbsp;';
                        htmlParts.push(`
                            <div class="diff-row">
                                <div class="diff-col line-delete"><span class="line-num">${d.lineA}</span><span class="line-content">${val}</span></div>
                                <div class="diff-col line-empty"><span class="line-num"></span><span class="line-content"></span></div>
                            </div>`);
                        delCount++;
                    } else if (d.type === 'insert') {
                        const val = escapeHtml(d.valB) || '&nbsp;';
                        htmlParts.push(`
                            <div class="diff-row">
                                <div class="diff-col line-empty"><span class="line-num"></span><span class="line-content"></span></div>
                                <div class="diff-col line-insert"><span class="line-num">${d.lineB}</span><span class="line-content">${val}</span></div>
                            </div>`);
                        insCount++;
                    }
                }
            }
            flushEqualBuffer();

            document.getElementById('diffBody').innerHTML = htmlParts.join('');
            document.getElementById('stats').innerHTML = `差异统计: <span class="ins">+${insCount} 行新增</span>, <span class="del">-${delCount} 行删除</span>`;
        }

        // ================= 主流程 =================

        async function startCompare() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            const text1Str = document.getElementById('text1').value;
            const text2Str = document.getElementById('text2').value;

            if (!file1 && !text1Str && !file2 && !text2Str) {
                alert("请至少选择文件或粘贴需要对比的文本！");
                return;
            }

            const btn = document.getElementById('btnCompare');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            loading.style.display = 'inline';
            
            // 使用 setTimeout 让 UI 有机会更新 loading 状态
            setTimeout(async () => {
                try {
                    const rawText1 = file1 ? await readFile(file1) : text1Str;
                    const rawText2 = file2 ? await readFile(file2) : text2Str;

                    currentTitles.t1 = file1 ? `📄 ${file1.name}` : (text1Str ? "📝 粘贴的旧文本" : "⬜ 空白");
                    currentTitles.t2 = file2 ? `📄 ${file2.name}` : (text2Str ? "📝 粘贴的新文本" : "⬜ 空白");

                    // 统一换行符并分割，过滤掉末尾多余的空行
                    const lines1 = rawText1.replace(/\r\n/g, '\n').split('\n');
                    const lines2 = rawText2.replace(/\r\n/g, '\n').split('\n');
                    
                    // 如果最后一行是空字符串（通常是因为文件末尾有换行符），则移除
                    if (lines1[lines1.length - 1] === '') lines1.pop();
                    if (lines2[lines2.length - 1] === '') lines2.pop();

                    currentDiffs = computeLCS(lines1, lines2);
                    renderDiff(currentDiffs, currentTitles.t1, currentTitles.t2);
                    
                } catch (err) {
                    alert("处理出错: " + err.message);
                    console.error(err);
                } finally {
                    btn.disabled = false;
                    loading.style.display = 'none';
                }
            }, 50);
        }
    </script>
</body>
</html>
