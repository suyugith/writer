<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能写作助手 2.2</title>

    <script src="js/marked.min.js"></script>
    <link rel="stylesheet" href="css/github.min.css">
    <script src="js/highlight.min.js"></script>
    <link rel="stylesheet" href="css/katex.min.css">
    <script src="js/katex.min.js"></script>
    <script src="js/auto-render.min.js"></script>
    <script src="js/mermaid.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">

    <style>
        /* 针对技能列表项按钮的补充样式 */
        .tech-item-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s, opacity 0.2s;
            font-size: 14px;
            line-height: 1;
        }
        .tech-item-btn:hover {
            background: rgba(0,0,0,0.08);
        }
        [data-theme="dark"] .tech-item-btn:hover {
            background: rgba(255,255,255,0.15);
        }
        .tech-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="sidebar" id="app-sidebar">
        <div class="sidebar-header">章节大纲</div>
        <div class="outline-list" id="outline-list"></div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="title">
                <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="展开/收起大纲">☰</button>
                文章正文
            </div>
            <div class="tools-basic">
                <button id="toggle-mode-btn" onclick="toggleMode()" title="编辑模式可以进行人工编辑和利用AI进行局部修改，渲染模式不可人工编辑和AI局部修改，但是可以全文修改">👁️ 切换渲染模式</button>
                <div class="dropdown" style="display: inline-block; position: relative;">
                    <button class="dropbtn" onclick="toggleDropdown()">⬇️ 下载 ▼</button>
                    <div class="dropdown-content" id="downloadDropdown">
                        <a href="#" onclick="downloadMarkdown(); return false;">下载为 Markdown (.md)</a>
                        <a href="#" onclick="downloadDocx(); return false;">下载为 Word (.docx)</a>
                    </div>
                </div>
                <button onclick="openModal('history-modal')">🕒 历史版本</button>
                <button onclick="undo()">↶ 撤回</button>
                <button onclick="clearContent()">🗑️ 清空</button>
                <button onclick="toggleTheme()" id="theme-btn" title="切换深色/浅色模式">🌓 暗色</button>
            </div>
        </div>

        <div class="editor-container">
            <textarea id="editor" class="editor-textarea" oninput="handleInput()"></textarea>
            <div id="preview" class="editor-preview markdown-body"></div>
            <div class="status-bar">
                <span id="word-count">字数: 0</span>
                <span id="save-time">最后保存: -</span>
            </div>
        </div>

        <div class="ai-tools">
            <button class="ai-btn btn-green" onclick="setPromptMode('ai_gen')">✍️ 续写</button>
            <button class="ai-btn btn-green" onclick="setPromptMode('rewrite')">📝 扩写</button>
            <button class="ai-btn btn-green" onclick="setPromptMode('summarize')">📄 浓缩</button>
            <button class="ai-btn btn-green" onclick="setPromptMode('polish')">✨ 润色</button>
            <div style="width: 1px; height: 24px; background-color: var(--border-color); margin: 0 5px;"></div>
            <button class="ai-btn btn-purple" onclick="openModal('replace-modal')">🔍 批量替换</button>
            <button class="ai-btn btn-purple" onclick="openModal('ref-modal')">📚 参考资料</button>
            <button class="ai-btn btn-purple" onclick="openModal('tech-modal')">💡 技能</button>
            <button class="ai-btn btn-purple" onclick="openModal('sysprompt-modal')" style="display: none;">🤖 System Prompt</button>
            <div style="width: 1px; height: 24px; background-color: var(--border-color); margin: 0 5px;"></div>
            <button class="ai-btn btn-orange" onclick="openModal('config-modal')">⚙️ LLM配置</button>
            <button class="ai-btn btn-orange" onclick="openModal('guide-modal')">📖 帮助</button>
            
        </div>

        <div class="prompt-container">
            <div class="prompt-title" style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 14px; color: var(--text-main);">AI编辑模式:</span>
                <select id="llm-mode-select" class="btn-modal" style="padding: 4px 8px; font-weight: bold; cursor:pointer;" onchange="updateSelectionHint()">
                    <option value="full">全文修改</option>
                    <option value="local">局部修改</option>
                    <option value="append">末尾追加</option>
                </select>
                <span id="selection-hint"></span>
            </div>
            <textarea id="llm-prompt" class="prompt-textarea" placeholder="请输入您的具体编辑或修改指令..."></textarea>
            <div class="prompt-actions">
                <div class="llm-stats-container">
                    <div id="llm-status-icon" class="status-icon idle" onclick="showLLMDetails()" title="未调用"></div>
                    <div class="llm-stats" id="llm-stats">
                        <span>耗时: 0ms</span> |
                        <span>上下文: 0 Tokens</span> |
                        <span>输出: 0 Tokens</span>
                    </div>
                </div>
                <button class="submit-btn" id="stop-btn" onclick="stopLLM()"
                    style="display: none; background-color: #ff4d4f;">
                    <span>停 止</span>
                </button>
                <button class="submit-btn" id="submit-btn" onclick="submitToLLM()">
                    <span id="submit-text">提 交</span>
                    <div class="loader" id="submit-loader"></div>
                </button>
            </div>
        </div>
    </div>

    <div id="floating-toolbar" class="floating-toolbar">
        <button onclick="floatingAction('polish')">✨ 润色</button>
        <button onclick="floatingAction('rewrite')">📝 扩写</button>
        <button onclick="floatingAction('summarize')">📄 浓缩</button>
    </div>

    <div id="modal-overlay" class="modal-overlay">

        <div id="history-modal" class="modal" style="display: none; width: 900px; max-width: 95vw;">
            <div class="modal-header">
                <span>历史版本管理</span>
                <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
            </div>
            <div class="history-layout">
                <div class="history-list-pane" id="history-list-container"></div>
                <div class="history-preview-pane">
                    <textarea id="history-detail-text" class="history-preview-textarea" readonly
                        placeholder="点击左侧版本查看全文..."></textarea>
                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button class="btn-modal btn-cancel" onclick="closeModal()">取消</button>
                        <button class="btn-modal btn-confirm" id="btn-restore-history"
                            onclick="restoreSelectedHistory()" disabled>恢复此版本</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="tech-modal" class="modal" style="display: none; width: 850px; max-width: 95vw;">
            <div class="modal-header">
                <span>写作技能管理</span>
                <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
            </div>
            <div class="history-layout">
                <div class="history-list-pane" id="tech-list-container"></div>
                <div class="history-preview-pane">
                    <div class="modal-group">
                        <label>技能名称</label>
                        <input type="text" id="tech-title" placeholder="如：技术方案写作技能">
                    </div>
                    <div class="modal-group">
                        <label>使用场景或条件</label>
                        <input type="text" id="tech-condition" placeholder="在什么情况下触发此技能？">
                    </div>
                    <div class="modal-group" style="flex:1;">
                        <label>技能描述</label>
                        <textarea id="tech-desc" placeholder="详细的指导说明..." style="height:100%; min-height:120px;"></textarea>
                    </div>
                    <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                        <button class="btn-modal btn-confirm" onclick="saveTechnique()">保存修改</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="replace-modal" class="modal" style="display: none;">
            <div class="modal-header">
                <span>批量替换文本</span>
                <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
            </div>
            <div class="modal-group">
                <label>查找内容</label>
                <input type="text" id="repl-search" placeholder="输入要查找的文字 (支持正则)">
            </div>
            <div class="modal-group">
                <label>替换为</label>
                <input type="text" id="repl-target" placeholder="输入替换后的文字">
            </div>
            <div class="modal-group" style="flex-direction: row; align-items: center; gap: 8px;">
                <input type="checkbox" id="repl-regex">
                <label for="repl-regex" style="font-size: 14px; cursor: pointer;">使用正则表达式</label>
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-modal btn-confirm" onclick="executeReplace()">全部替换</button>
            </div>
        </div>

        <div id="config-modal" class="modal" style="display: none;">
            <div class="modal-header">
                <span>LLM 接口配置</span>
                <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
            </div>
            <div class="modal-group">
                <label>接口 URL (例如: https://api.openai.com/v1/chat/completions)</label>
                <input type="text" id="cfg-url" placeholder="必须完整包含 /v1/chat/completions">
            </div>
            <div class="modal-group">
                <label>API Key</label>
                <input type="password" id="cfg-key" placeholder="输入您的 API Key">
            </div>
            <div class="modal-group">
                <label>模型名称 (Model Name)</label>
                <input type="text" id="cfg-model" placeholder="例如: gpt-3.5-turbo">
            </div>
            <div class="modal-group">
                <label>温度参数 (Temperature: 0.0 - 2.0)</label>
                <input type="number" id="cfg-temp" step="0.1" min="0" max="2" value="0.7">
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-modal btn-confirm" onclick="saveConfig()">保存配置</button>
            </div>
        </div>

        <div id="ref-modal" class="modal" style="display: none; width: 850px; max-width: 95vw; height: 75vh;">
            <div class="modal-header">
                <span>管理参考资料</span>
                <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px;">
                <div class="modal-group" style="gap:0;">
                    <label style="font-weight:bold; color:var(--btn-primary); font-size:14px;">参考内容</label>
                    <span style="font-size: 12px; color: var(--text-muted);">在此粘贴背景资料，让 AI 做到有据可依，杜绝幻觉。</span>
                </div>
                <div class="file-input-wrapper">
                    <label for="ref-file" class="btn-modal btn-cancel" style="cursor: pointer; font-size: 12px; padding: 6px 12px; font-weight:bold;">📂 导入本地文件</label>
                    <input type="file" id="ref-file" accept=".txt,.md" onchange="readLocalFile(event)" style="display:none;">
                </div>
            </div>
            <div class="modal-group" style="flex:1; display:flex; flex-direction:column; min-height:0;">
                <textarea id="ref-content" placeholder="在此粘贴海量参考资料..." style="flex: 1; height: 100%; min-height: 200px; resize: none;"></textarea>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <div class="modal-group" style="flex-direction: row; align-items: center; gap: 8px;">
                    <input type="checkbox" id="ref-enabled" style="width: 16px; height: 16px;">
                    <label for="ref-enabled"
                        style="font-size: 14px; font-weight: bold; color: var(--text-main); cursor: pointer;">
                        调用LLM时附带参考资料
                    </label>
                </div>
                <div class="modal-actions" style="margin-top: 0;">
                    <button class="btn-modal btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn-modal btn-confirm" onclick="saveReference()">保存</button>
                </div>
            </div>
        </div>

        <div id="guide-modal" class="modal" style="display: none; width: 850px; max-width: 95vw;">
            <div class="modal-header">
                <span>📖 智能写作助手 使用说明</span>
                <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
            </div>
            <div class="modal-group" style="flex:1; overflow-y:auto; max-height: 60vh; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; background: var(--editor-bg);">
                <div id="guide-content" class="editor-preview markdown-body" style="display: block; padding: 10px;"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-confirm" onclick="closeModal()">我已了解</button>
            </div>
        </div>

        <div id="sysprompt-modal" class="modal" style="display: none; width: 600px;">
            <div class="modal-header">
                <span>System Prompt (只读)</span>
                <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
            </div>
            <div class="modal-group">
                <label style="color:var(--btn-primary); font-weight:bold;">系统底层提示词，强制约束 LLM 的行为与输出格式（已适配三种模式）：</label>
                <textarea id="sys-content" style="height: 350px; line-height:1.5; font-family: monospace; background: var(--bg-sidebar); border: none;" readonly></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeModal()">关闭</button>
            </div>
        </div>

        <div id="llm-details-modal" class="modal" style="display: none; width: 650px;">
            <div class="modal-header">
                <span>LLM 请求调试详情</span>
                <button class="modal-close-btn" onclick="closeModal()" title="关闭">&times;</button>
            </div>
            <div class="modal-group" id="llm-error-group" style="display: none;">
                <label style="color: red; font-weight: bold;">❌ 错误信息</label>
                <div id="llm-error-msg"
                    style="color: red; font-size: 13px; background: #fee; padding: 10px; border-radius: 6px; border: 1px solid #fcc; word-break: break-all;">
                </div>
            </div>
            <div class="modal-group">
                <label>Request Payload (提交内容)</label>
                <textarea id="llm-req-text" class="readonly-textarea" readonly></textarea>
            </div>
            <div class="modal-group">
                <label>Response / Exception (流式输出全记录)</label>
                <textarea id="llm-res-text" class="readonly-textarea" readonly></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-modal btn-cancel" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="js/html-docx.min.js"></script>
    <script>
        // --- 核心配置初始化 ---
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                highlight: function (code, lang) {
                    if (lang && typeof hljs !== 'undefined' && hljs.getLanguage(lang)) {
                        try { return hljs.highlight(code, { language: lang }).value; } catch (__) { }
                    }
                    return code;
                },
                breaks: true
            });
        }

        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({ startOnLoad: false, theme: 'default' });
        }

        // ===================== 【提示信息与占位符设置】 =====================
        const emptyPromptMarkdown = `# 👋 欢迎使用智能写作助手 2.1

不用担心不会用，这里就像是一个带魔法的“记事本”！您可以直接在下面打字，或者把其他地方的文章粘贴进来。

## 💡 怎么使用这个魔法？

### 1. 怎么让 AI 帮我改文章？
* 🎯 **局部修改**：用鼠标**选中**文章里的一句话或一段话，旁边马上会弹出一个悬浮小菜单。您可以点击「✨ 润色」让句子更通顺，点击「📝 扩写」让内容更丰富。
* 📝 **全文修改**：如果您想让 AI 帮您修改整篇文章，只要**什么都不选**，在右下角的输入框里告诉 AI 您的想法（比如：“帮我把整篇文章改得更生动一些”），然后点击提交即可！
* ➕ **续写文章**：点击右下角输入框上面的下拉菜单，选择「末尾追加」，AI 就会顺着您写过的内容接着往下写。

### 2. 什么是渲染模式？
* 当您写完文章后，可以点击顶部的 **「切换渲染模式」**，此时您的文章会变成排版精美的最终效果。

### 3. 让 AI 更聪明的小技巧
* 📚 **上传参考资料**：点击右侧的「参考资料」，您可以把手头上的内部文件（比如公司介绍、项目要求）放进去。这样 AI 在写文章时，就会参考您的真实资料，不会胡编乱造！
* 🎯 **开启写作技能**：点击「写作技能」，您可以给 AI 设定一个专门的写作风格。比如让它使用“讲故事的口吻”或者“严谨的工作报告格式”。

### 4. 初次使用必看：配置大模型
在开始体验 AI 功能前，您需要先告诉系统使用哪个大模型：
1. 点击右侧工具栏底部的 **[⚙️ LLM配置]** 按钮。
2. 填入相关参数，例如：
   * **接口地址 (URL)**：https://api.deepseek.com/chat/completions 或者 http://127.0.0.1:8002/v1/chat/completions
   * **API Key**：您在服务商处申请的专属密钥（如 \`sk-xxxxxx\`）
   * **模型名称**：填写对应的模型，如 \`deepseek-chat\` 或 \`qwen35-27b\`

### 🔒 数据安全与隐私说明
* 本工具采用纯本地优先架构，您的**文章正文、历史版本以及您的个人配置等所有数据，均安全保存在您本机的浏览器缓存中**。
* **服务器不留存任何用户数据**。当您点击提交让 AI 帮您修改时，数据只会在传输给您配置的大模型接口的那一瞬间被使用。您的隐私和数据主权完全在您自己手中。
`;
        // ====================================================================

        // --- 核心状态 ---
        let history = [];
        let historyIndex = -1;
        let isPreviewMode = false;

        let appConfig = { url: 'http://127.0.0.1:8081/llm/v1/chat/completions', key: 'sk-1234567890...', model: 'qwen3.5-27b', temp: 0.7 };
        let refData = { content: '', enabled: false };

        let techniques = [];
        let currentTechIndex = -1;
        let interactionHistory = [];

        const sysPromptText = `# Role: 顶尖写作助手与文字处理专家

## Profile:
- author: AI Writing Assistant System
- version: 2.2
- language: 中文
- description: 你是一个具备深厚文字功底的专业写作助手。你的核心使命是严格遵循用户的各项标签指令，高效、精准地进行文本处理。

## Input Tags Description (输入标签定义):
为了让你更好地理解上下文，系统会通过以下XML标签向你输送信息：
- <edit_mode>: 本次修改的模式（全文修改、局部修改、末尾追加）。
- <task_instruction>: 用户给你的具体执行指令。
- <full_context>: 完整的文章内容。
- <target_text_to_process>: 当进行局部修改时，这里是你需要重点处理的目标文本。
- <before_selection> / <after_selection>: 局部修改时，目标文本前后的上下文（仅供参考，绝对不要包含在你的输出中）。
- <reference_material>: 用户提供的高价值私域知识与参考资料。你必须将其作为重要的事实依据，从中提取关键信息来支撑你的创作，同时确保最终生成的内容紧密贴合当前的写作主题与逻辑上下文，不可生搬硬套。

## 格式与排版
本系统支持对markdown文字进行渲染，格式遵循以下规范：
1. 仅使用标准的markdown语法
2. 较长的全文内容，采用带序号的一级或二级序号做标题，例如：## 1. 第一章， ### 1.1 第1小节...
3. 技术性较强的内容可以使用表格、公式、mermaid图

## Strict Rules (绝对约束):
1. **【零废话原则】**：你的输出将被程序直接用于替换或追加文档内容。严禁输出任何开场白、解释说明或总结。
2. **【模式执行与边界控制】**（核心）：
   - 若 <edit_mode> 为 "全文修改"：必须输出修改后的完整文章全文，不要遗漏未修改的部分。
   - 若 <edit_mode> 为 "局部修改"：仅输出对 <target_text_to_process> 处理后的结果，绝对禁止包含前后上下文！
   - 若 <edit_mode> 为 "末尾追加"：仅输出生成的新内容，绝对禁止重复输出已有的 <full_context> 内容！
`;

        let lastLLMReq = "";
        let lastLLMRes = "";
        let lastLLMErr = "";
        let currentSelectedHistoryIndex = -1;
        
        // --- IndexedDB 简单封装 ---
        const DB_NAME = 'WriterAssistantDB';
        const DB_VERSION = 1;
        let dbInstance = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('store')) {
                        db.createObjectStore('store');
                    }
                };
                request.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
                request.onerror = (e) => reject(e);
            });
        }

        function dbSet(key, val) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve();
                const tx = dbInstance.transaction('store', 'readwrite');
                tx.objectStore('store').put(val, key);
                tx.oncomplete = () => resolve();
            });
        }

        function dbGet(key) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(null);
                const tx = dbInstance.transaction('store', 'readonly');
                const req = tx.objectStore('store').get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        async function renderMarkdownView() {
            let text = editor.value;
            // if (!text.trim()) text = emptyPromptMarkdown;
            
            try {
                // 1. 公式保护机制：在 marked 解析前，把公式抽离成占位符，防止 _ 和 * 被错误解析成斜体/粗体
                const mathBlocks = [];
                let placeholderText = text.replace(/(\$\$[\s\S]*?\$\$|\$[^$\n]*?\$)/g, (match) => {
                    mathBlocks.push(match);
                    return `XYZMATHBLOCK${mathBlocks.length - 1}XYZ`; // 纯字母占位符，不会触发 Markdown
                });

                // 2. 渲染 Markdown
                let html;
                if (typeof marked !== 'undefined') {
                    html = marked.parse(placeholderText);
                } else {
                    html = `<pre>${placeholderText}</pre>`;
                }

                // 3. 将公式占位符替换回真实的数学公式
                html = html.replace(/XYZMATHBLOCK(\d+)XYZ/g, (match, i) => {
                    return mathBlocks[i];
                });

                preview.innerHTML = html;

                // 4. 调用 KaTeX 渲染公式
                if (typeof renderMathInElement !== 'undefined') {
                    renderMathInElement(preview, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true }, 
                            { left: '$', right: '$', display: false },
                            { left: '\\(', right: '\\)', display: false }, 
                            { left: '\\[', right: '\\]', display: true }
                        ], 
                        throwOnError: false
                    });
                }

                // 5. 渲染 Mermaid 图表
                if (typeof mermaid !== 'undefined') {
                    const mermaidBlocks = preview.querySelectorAll('.language-mermaid');
                    for (let i = 0; i < mermaidBlocks.length; i++) {
                        const block = mermaidBlocks[i];
                        const code = block.textContent; // 获取纯净的代码文本
                        
                        const container = document.createElement('div');
                        container.className = 'mermaid';
                        
                        try {
                            // 加入 Date.now() 确保每次切换渲染模式时 ID 绝对唯一，防止冲突
                            const chartId = 'mermaid-chart-' + Date.now() + '-' + i;
                            const renderResult = await mermaid.render(chartId, code);
                            
                            // 兼容旧版 Mermaid (v9 返回 string) 与 新版 (v10+ 返回对象 {svg})
                            container.innerHTML = typeof renderResult === 'string' ? renderResult : renderResult.svg;
                            
                            // 替换原有的 <pre> 代码块
                            if (block.parentNode && block.parentNode.tagName === 'PRE') {
                                block.parentNode.replaceWith(container);
                            } else {
                                block.replaceWith(container);
                            }
                        } catch (e) {
                            console.error("Mermaid Render Error:", e);
                            container.innerHTML = `<pre style="color:red; font-size: 12px; background: #fee; padding: 10px;">Mermaid Syntax Error:\n${e.message}</pre>`;
                            if (block.parentNode && block.parentNode.tagName === 'PRE') {
                                block.parentNode.replaceWith(container);
                            } else {
                                block.replaceWith(container);
                            }
                        }
                    }
                }
            } catch (err) { 
                preview.innerHTML = `<p style="color:red">渲染发生致命错误: ${err.message}</p>`; 
            }
        }

        function updateOutline() {
            let text = editor.value;
            text = text.replace(/```[\s\S]*?```/g, ''); 
            const regex = /^(#{1,3})\s+(.*)$/gm;
            let match;
            outlineList.innerHTML = '';
            let count = 0;
            let headingIndex = 0;

            while ((match = regex.exec(text)) !== null) {
                count++;
                const level = match[1].length;
                const title = match[2];
                const div = document.createElement('div');
                div.className = `outline-item outline-h${level}`;
                div.innerText = title; div.title = title;
                const matchIndex = match.index;
                const currentHeadingIndex = headingIndex;

                div.onclick = () => {
                    if (!isPreviewMode) {
                        editor.focus();
                        editor.setSelectionRange(matchIndex, matchIndex);
                        const clone = document.createElement('div');
                        const style = window.getComputedStyle(editor);
                        clone.style.cssText = `position: absolute; visibility: hidden; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; font-family: ${style.fontFamily}; font-size: ${style.fontSize}; line-height: ${style.lineHeight}; padding: ${style.padding}; width: ${editor.clientWidth}px; box-sizing: border-box;`;
                        clone.textContent = text.substring(0, matchIndex);
                        document.body.appendChild(clone);
                        const scrollY = clone.offsetHeight;
                        document.body.removeChild(clone);
                        editor.scrollTop = scrollY - parseInt(style.paddingTop || 20);
                    } else {
                        const headings = preview.querySelectorAll('h1, h2, h3');
                        if (headings[currentHeadingIndex]) headings[currentHeadingIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                };
                outlineList.appendChild(div);
                headingIndex++;
            }
            if (count === 0) outlineList.innerHTML = '<div style="color:#aaa; font-size:12px;">暂无目录结构</div>';
        }

#### 一、 写作核心原则 (Core Tenets)

        async function loadLocalData() {
            try {
                const [savedConfig, savedRef, savedInteraction, savedTech] = await Promise.all([
                    dbGet('writer_llm_config'), dbGet('writer_ref_data'), dbGet('writer_interaction_history'), dbGet('writer_techniques')
                ]);
                if (savedConfig) Object.assign(appConfig, savedConfig);
                if (savedRef) refData = savedRef;
                if (savedInteraction) interactionHistory = savedInteraction;

                if (savedTech && savedTech.length > 0) {
                    techniques = savedTech;
                    let needSave = false;
                    for (const defTech of DEFAULT_TECHNIQUES) {
                        const existTech = techniques.find(t => t.id === defTech.id);
                        if (existTech) {
                            if (existTech.description !== defTech.description) { existTech.description = defTech.description; needSave = true; }
                        } else { techniques.push({ ...defTech }); needSave = true; }
                    }
                    if (needSave) await dbSet('writer_techniques', techniques);
                } else {
                    techniques = DEFAULT_TECHNIQUES.map(t => ({ ...t }));
                    await dbSet('writer_techniques', techniques);
                }
            } catch (error) { console.error("Failed to load local data:", error); }
        }

            try {

                if (isRegex) content = content.replace(new RegExp(searchStr, 'g'), targetStr);

        function setPromptMode(mode) {

            for(let i = 0; i < modeSelect.options.length; i++) {

            } else {
                if (start !== end && !isPreviewMode) modeSelect.value = 'local';
                else modeSelect.value = 'full';
                if (mode === 'rewrite') promptInput.value = '把当前内容展开描写，补充详细内容，或者补充具体例子';
                else if (mode === 'summarize') promptInput.value = '对当前内容提炼主要内容和观点，编写更概况性的内容';

        // 1. 主控函数：负责整体请求调度与异常捕获
        async function submitToLLM() {
            const promptInput = document.getElementById('llm-prompt').value.trim();
            if (!promptInput) { alert("请输入需要发送给 LLM 的指令！"); return; }
            if (!appConfig.url) { alert("请先在 [⚙️ LLM配置] 中设置正确的接口 URL。"); return; }

            // 构建请求上下文
            const ctx = buildLLMContext(promptInput);
            if (!ctx) return; // 校验失败（如未选中文本）则终止

            abortController = new AbortController();
            lastLLMReq = JSON.stringify(ctx.payload, null, 2); 
            lastLLMRes = ""; 
            lastLLMErr = "";
            const startTime = Date.now();

            setLLMUIState(true); // 切换为加载中 UI

            try {
                const response = await fetch(appConfig.url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${appConfig.key}`, 'Accept': 'text/event-stream' },
                    body: lastLLMReq, 
                    signal: abortController.signal
                });

                if (!response.ok) { 
                    const errText = await response.text(); 
                    throw new Error(`HTTP ${response.status}: ${errText}`); 
                }

                // 处理流式输出
                const streamResult = await processSSEStream(response.body.getReader(), ctx);
                
                // 收尾更新
                saveState(editor.value); 
                updateUI();

                // 记录交互历史
                interactionHistory.push({ user: promptInput, assistant: streamResult.finalText });
                if (interactionHistory.length > 10) interactionHistory.shift();
                dbSet('writer_interaction_history', interactionHistory);

                // 更新统计看板
                const duration = Date.now() - startTime;
                let displayReasoning = streamResult.rawReasoningText ? `\n\n【独立思考过程 (reasoning_content)】\n${streamResult.rawReasoningText}` : '';
                lastLLMRes = `【SSE 流式传输成功】\n最终提取文本字数：${streamResult.finalText.length}\n最终生成Tokens：${streamResult.outputTokens}${displayReasoning}\n\n【底层原始完整输出 (content)】\n${streamResult.rawOutputText}`;

                statusIcon.className = 'status-icon success'; 
                statusIcon.title = "请求成功，点击查看详情";
                document.getElementById('llm-stats').innerHTML = `<span>耗时: ${duration}ms</span> | <span>上下文: ${streamResult.actualInputTokens} Tokens</span> | <span>输出: ${streamResult.outputTokens} Tokens</span>`;

            } catch (error) {
                const duration = Date.now() - startTime;
                lastLLMErr = error.toString();
                statusIcon.className = 'status-icon error'; 
                statusIcon.title = "请求失败，点击查看详情";
                document.getElementById('llm-stats').innerHTML = `<span style="color:red;">耗时: ${duration}ms (失败)</span> | <span>上下文: ~${ctx.estimatedTokens} Tokens</span> | <span>输出: 0 Tokens</span>`;
            } finally {
                setLLMUIState(false); // 恢复 UI 状态
                abortController = null;
            }
        }

        // 2. 数据构建：负责处理文本截取、System Prompt 组装
        function buildLLMContext(promptInput) {
            const modeSelect = document.getElementById('llm-mode-select').value;
            const fullText = editor.value;
            const originalStart = editor.selectionStart;
            const originalEnd = editor.selectionEnd;
            const selectedText = fullText.substring(originalStart, originalEnd);

            if (modeSelect === 'local' && originalStart === originalEnd) {
                alert("【局部修改】模式下，请先在编辑器正文中选中需要修改的文字范围！"); 
                return null;
            }

            const modeStrMap = { 'full': '全文修改', 'local': '局部修改', 'append': '末尾追加' };
            const modeStr = modeStrMap[modeSelect] || '全文修改';

            let userContent = `<edit_mode>${modeStr}</edit_mode>\n<task_instruction>\n${promptInput}\n</task_instruction>\n\n`;
            if (refData.enabled && refData.content.trim() !== "") {
                userContent += `<reference_material>\n${refData.content}\n</reference_material>\n\n`;
            }

            let baseTextPre = "", baseTextPost = "";
            if (modeSelect === 'local') {
                baseTextPre = fullText.substring(0, originalStart);
                baseTextPost = fullText.substring(originalEnd);
                userContent += `<before_selection>\n${baseTextPre}\n</before_selection>\n\n<target_text_to_process>\n${selectedText}\n</target_text_to_process>\n\n<after_selection>\n${baseTextPost}\n</after_selection>\n`;
            } else if (modeSelect === 'append') {
                baseTextPre = fullText + (fullText.endsWith('\n') ? "" : "\n\n");
                userContent += `<full_context>\n${fullText}\n</full_context>\n`;
            } else {
                userContent += `<full_context>\n${fullText}\n</full_context>\n`;
            }

            let finalSysPrompt = sysPromptText;
            let techStr = techniques.filter(t => t.enabled).map(t => `- **技能名称**：${t.title}\n  - **使用场景**：${t.condition}\n  - **执行要求**：${t.description}\n`).join('');
            if (techStr) {
                finalSysPrompt += `\n\n## 启用的专属写作技能:\n当前用户为你启用了以下专属写作技能。这是你执行任务的最高准则！请仔细阅读其【使用场景】和【执行要求】，写作技能在【使用场景】与写作要求、文体类型、用户指令匹配时才生效。写作技能生效时，在生成内容时严格贯彻其写作风格、语气和结构排版规范，如果技能要求与常规行为冲突，以技能要求为准：\n${techStr}`;
            }

            let messagesPayload = [{ role: "system", content: finalSysPrompt }];
            for (let msg of interactionHistory.slice(-10)) {
                messagesPayload.push({ role: "user", content: msg.user.length > 200 ? msg.user.substring(0, 200) + '...[已截断]' : msg.user });
                messagesPayload.push({ role: "assistant", content: msg.assistant.length > 200 ? msg.assistant.substring(0, 200) + '...[已截断]' : msg.assistant });
            }
            messagesPayload.push({ role: "user", content: userContent });

            const payload = {
                model: appConfig.model, temperature: appConfig.temp, stream: true,
                stream_options: { include_usage: true }, enable_thinking: true, extra_body: { enable_thinking: true },
                messages: messagesPayload
            };

            return { 
                payload, baseTextPre, baseTextPost, 
                estimatedTokens: Math.floor(JSON.stringify(payload).length * 0.8)
            };
        }

        // 3. UI 状态管理器：控制按钮、加载条与禁用逻辑
        function setLLMUIState(isProcessing) {
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('submit-text');
            const loader = document.getElementById('submit-loader');
            const stopBtn = document.getElementById('stop-btn');

            btn.disabled = isProcessing;
            btn.style.display = isProcessing ? 'none' : 'flex';
            stopBtn.style.display = isProcessing ? 'flex' : 'none';
            btnText.style.display = isProcessing ? 'none' : 'block';
            loader.style.display = isProcessing ? 'block' : 'none';
            
            editor.readOnly = isProcessing;
            if (isProcessing) {
                statusIcon.className = 'status-icon loading'; 
                statusIcon.title = "请求发送中...";
            } else {
                if (isPreviewMode) renderMarkdownView();
                document.getElementById('selection-hint').innerHTML = ''; 
            }
        }

        // 4. 数据流解析器：处理 SSE 流与节流渲染
        async function processSSEStream(reader, ctx) {
            const decoder = new TextDecoder('utf-8');
            let buffer = '', pendingData = '';
            let lastRenderTime = 0;
            
            // 声明状态机对象
            const state = {
                rawOutputText: '', rawReasoningText: '', cleanOutputText: '',
                lastProcessedIndex: 0, isThinking: false, hasFinishedThinking: false,
                outputTokens: 0, actualInputTokens: ctx.estimatedTokens
            };

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                let match;
                let isStreamDone = false;
                while ((match = /\r?\n\r?\n/.exec(buffer)) !== null) {
                    let chunk = buffer.slice(0, match.index).trim();
                    buffer = buffer.slice(match.index + match[0].length);
                    if (!chunk) continue;

                    let chunkDataStr = chunk.replace(/(^|\n)data:\s*/gi, '').trim();
                    if (chunkDataStr === '[DONE]') { isStreamDone = true; break; }

                    if (chunkDataStr) {
                        pendingData += chunkDataStr;
                        try {
                            const data = JSON.parse(pendingData);
                            pendingData = ''; 
                            
                            // 更新 Token 统计
                            if (data.usage) {
                                if (data.usage.completion_tokens) state.outputTokens = data.usage.completion_tokens;
                                if (data.usage.prompt_tokens) state.actualInputTokens = data.usage.prompt_tokens;
                            }
                            // 核心流数据注入状态机
                            if (data.choices && data.choices[0].delta) {
                                const delta = data.choices[0].delta;
                                if (delta.reasoning_content) state.rawReasoningText += delta.reasoning_content;
                                if (delta.content) updateThinkStateMachine(state, delta.content);
                            }
                        } catch (e) { /* JSON不完整，等待下一个块拼接 */ }
                    }
                }
                if (isStreamDone) break;

                // 节流渲染 UI (30fps)
                const now = Date.now();
                if (now - lastRenderTime >= 33) {
                    editor.value = ctx.baseTextPre + state.cleanOutputText + ctx.baseTextPost;
                    editor.scrollTop = editor.scrollHeight; 
                    lastRenderTime = now;
                }
            }

            // 【修复漏洞1】处理流意外断开时，残留在 buffer 中的最后一条数据
            if (buffer.trim()) {
                let chunkDataStr = buffer.replace(/(^|\n)data:\s*/gi, '').trim();
                if (chunkDataStr && chunkDataStr !== '[DONE]') {
                    try {
                        const data = JSON.parse(chunkDataStr);
                        if (data.choices && data.choices[0].delta && data.choices[0].delta.content) {
                            updateThinkStateMachine(state, data.choices[0].delta.content);
                        }
                    } catch (e) {}
                }
            }

            // 【修复漏洞2】释放状态机为了检测 <think>/</think> 标签而强制扣留的最后几个字符
            // isThinking=true 表示 <think> 未闭合，此时扣留内容属于思考过程，应静默丢弃
            if (state.lastProcessedIndex < state.rawOutputText.length) {
                if (!state.isThinking) {
                    state.cleanOutputText += state.rawOutputText.substring(state.lastProcessedIndex);
                }
                state.lastProcessedIndex = state.rawOutputText.length;
            }

            // 最终无损渲染
            const finalCleanText = state.cleanOutputText.trimStart();
            editor.value = ctx.baseTextPre + finalCleanText + ctx.baseTextPost;
            editor.focus();
            const endCursor = ctx.baseTextPre.length + finalCleanText.length;
            editor.setSelectionRange(endCursor, endCursor);

            state.outputTokens = state.outputTokens || Math.floor((state.rawOutputText.length + state.rawReasoningText.length) * 0.8);
            return {
                finalText: finalCleanText,
                rawOutputText: state.rawOutputText,
                rawReasoningText: state.rawReasoningText,
                outputTokens: state.outputTokens,
                actualInputTokens: state.actualInputTokens
            };
        }

        // 5. 状态机机制：专职拦截 `<think>` 标签内容
        function updateThinkStateMachine(state, newContent) {
            state.rawOutputText += newContent;
            let searchStart = state.lastProcessedIndex;

            while (searchStart < state.rawOutputText.length) {
                if (!state.hasFinishedThinking) {
                    if (!state.isThinking) {
                        let thinkStart = state.rawOutputText.indexOf('<think>', searchStart);
                        if (thinkStart !== -1) {
                            state.cleanOutputText += state.rawOutputText.substring(searchStart, thinkStart);
                            state.isThinking = true;
                            searchStart = thinkStart + '<think>'.length;
                        } else {
                            // 安全防截断，保留7个字符看下文是否能拼成 <think>
                            let safeEnd = Math.max(searchStart, state.rawOutputText.length - 7);
                            if (safeEnd > searchStart) {
                                state.cleanOutputText += state.rawOutputText.substring(searchStart, safeEnd);
                                searchStart = safeEnd;
                            }
                            break;
                        }
                    } else {
                        let thinkEnd = state.rawOutputText.indexOf('</think>', searchStart);
                        if (thinkEnd !== -1) {
                            state.isThinking = false;
                            state.hasFinishedThinking = true;
                            searchStart = thinkEnd + '</think>'.length;
                        } else {
                            // 安全防截断，保留8个字符看下文是否能拼成 </think>
                            let safeEnd = Math.max(searchStart, state.rawOutputText.length - 8);
                            if (safeEnd > searchStart) searchStart = safeEnd;
                            break;
                        }
                    }
                } else {
                    state.cleanOutputText += state.rawOutputText.substring(searchStart);
                    searchStart = state.rawOutputText.length;
                    break;
                }
            }
            state.lastProcessedIndex = searchStart;
        }
    </script>
